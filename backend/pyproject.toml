[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinveil"
version = "0.1.0"
description = "Offline, deterministic de-identification engine for multilingual Indian hospital data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Runtime dependencies must also be mirrored in the root requirements.txt (the
# evaluator installs that file, not this package). Phase 0: standard library only.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
clinveil = "clinveil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "toolkit: needs the organiser toolkit checked out at ../organiser-toolkit (skipped otherwise)",
  "starter_parity: pins Phase 0 byte-parity with the official starter; retire when Phase 1 changes output",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = [
  "S101",  # assert is fine in tests
  "S603",  # subprocess without shell: tests run our own CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
